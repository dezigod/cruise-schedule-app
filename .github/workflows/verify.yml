name: Verify cruise adapter
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/ship-capacities.json'
      - 'requirements-official.txt'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-official.txt
      - name: Offline parser, exporter and safety regression tests
        run: python -m unittest discover -s tests -v
