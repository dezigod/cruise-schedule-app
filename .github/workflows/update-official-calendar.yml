name: Update Official Cruise Calendar
on:
  schedule:
    # Retry scheduling away from the top of the hour. Source traffic stays
    # limited by the durable six-hour collection reservation.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-cruise-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser
        run: pip install -r requirements-official.txt
      - name: Test feed validation and source selection
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate official listings
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_official_calendar.py --work "$RUNNER_TEMP/official-work" --state "$RUNNER_TEMP/official-state/state.json" --github-state
      - name: Publish only the validated derived feed
        if: steps.collect.outputs.collected == 'true'
        run: |
          cp "$RUNNER_TEMP/official-work/official-cruise-calendar-v1.json" official-cruise-calendar-v1.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add official-cruise-calendar-v1.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: refresh official cruise calendar"
          git pull --rebase origin main
          git push origin HEAD:main
